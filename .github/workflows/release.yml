name: release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            bundle_args: ""
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            bundle_args: ""
          - platform: windows-latest
            rust-target: ""
            args: ""
            bundle_args: "--bundles nsis"
          - platform: ubuntu-22.04
            rust-target: ""
            args: ""
            bundle_args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check tag matches tauri.conf.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"         # 0.1.0-rc.1
          stem="${tag%%-*}"                # 0.1.0
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$stem" != "$conf" ]; then
            echo "::error::tag stem $stem != tauri.conf.json version $conf"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Keep in sync with specs/05-*.md (Tauri v2 prerequisites, webkitgtk 4.1).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 # version comes from package.json "packageManager" (Spec 04)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc # pinned by Spec 04
          cache: pnpm

      - name: Install Rust toolchain (honors rust-toolchain.toml from Spec 04)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add macOS cross-compile target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }} # arm64/x64 mac builds must not share a cache

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Spec 08: stage code-signing secrets ONLY when non-empty. Do NOT move
      # these into the tauri-action env: block — a missing GH secret resolves
      # to "" and tauri-bundler gates signing on env-var *presence* (var_os,
      # no is_empty), so a set-but-empty APPLE_CERTIFICATE fails the build
      # importing an empty .p12. Unset vars => unsigned build, green run.
      # See docs/signing.md.
      - name: Stage code-signing secrets (unsigned build when absent)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          present() { [ -n "${!1}" ]; }
          stage() {
            name="$1"
            if present "$name"; then
              eof="EOF_${name}_${RANDOM}${RANDOM}"
              { echo "${name}<<${eof}"; echo "${!name}"; echo "${eof}"; } >> "$GITHUB_ENV"
              echo "staged ${name}"
            fi
          }
          count() { local n=0 v; for v in "$@"; do if present "$v"; then n=$((n+1)); fi; done; echo "$n"; }

          # Pair/trio guards — partial sets are operator error; fail fast here
          # with a readable message instead of mid-cargo (or silently unsigned).
          pair="$(count APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD)"
          if [ "$pair" = "1" ]; then
            echo "::error::APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD must be set together (docs/signing.md §2)"; exit 1
          fi
          trio="$(count APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)"
          if [ "$trio" != "0" ] && [ "$trio" != "3" ]; then
            echo "::error::set all of APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID, or none (docs/signing.md §2)"; exit 1
          fi
          az="$(count AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET)"
          if [ "$az" != "0" ] && [ "$az" != "3" ]; then
            echo "::error::set all of AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET, or none (docs/signing.md §3)"; exit 1
          fi
          if [ "$trio" = "3" ] && [ "$pair" = "0" ]; then
            echo "::warning::notarization secrets set without APPLE_CERTIFICATE — notarization only runs on signed builds (docs/signing.md §2)"
          fi

          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                   AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            stage "$v"
          done

      - name: Build cr and prepare sidecar
        shell: bash
        run: |
          if [ -n "${{ matrix.rust-target }}" ]; then
            TRIPLE="${{ matrix.rust-target }}"
            cargo build --locked --release --bin cr --manifest-path src-tauri/Cargo.toml --target "$TRIPLE"
            SRC="src-tauri/target/${TRIPLE}/release/cr"
          else
            TRIPLE="$(rustc -Vv | grep '^host:' | awk '{print $2}')"
            cargo build --locked --release --bin cr --manifest-path src-tauri/Cargo.toml
            SRC="src-tauri/target/release/cr"
          fi

          EXT=""
          [[ "$TRIPLE" == *"windows"* ]] && EXT=".exe"
          SRC="${SRC}${EXT}"

          mkdir -p src-tauri/binaries
          cp "$SRC" "src-tauri/binaries/cr-${TRIPLE}${EXT}"
          chmod +x "src-tauri/binaries/cr-${TRIPLE}${EXT}" || true

          # Standalone asset for the GitHub release
          cp "$SRC" "cr-${TRIPLE}${EXT}"
          echo "CR_ASSET=cr-${TRIPLE}${EXT}" >> "$GITHUB_ENV"

          # Config override that injects externalBin into the Tauri bundle
          echo '{"bundle":{"externalBin":["binaries/cr"]}}' > src-tauri/tauri.sidecar.conf.json

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Spec 07: minisign updater signing keys (set via `gh secret set`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple/Windows signing env arrives via GITHUB_ENV from the
          # "Stage code-signing secrets" step above — never reference those
          # secrets here directly (empty string != unset for tauri-bundler).
          # See docs/signing.md.
        with:
          tagName: ${{ github.ref_name }}
          tauriScript: pnpm exec tauri
          releaseName: "CodeReview ${{ github.ref_name }}"
          includeUpdaterJson: true
          releaseBody: |
            Unsigned build — see assets below.

            macOS: the app is not notarized; after installing, run
            `xattr -dr com.apple.quarantine /Applications/CodeReview.app`
            (or right-click → Open). Windows: SmartScreen will warn; choose
            "Run anyway".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ matrix.bundle_args }} --config src-tauri/tauri.sidecar.conf.json -- --locked

      - name: Upload standalone cr binary to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.CR_ASSET }}" --clobber
