<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeReview</title>
    <script>
      // FOUC guard: set the theme classes (cr cr-{dir} {mode}) on <html> before
      // first paint, from the persisted zustand settings, so the app never
      // flashes an unthemed/wrong-mode frame. useApplySettings reconciles on mount.
      (function () {
        try {
          var dir = "a";
          var mode = null;
          var custom = null;
          var raw = localStorage.getItem("codereview-settings");
          if (raw) {
            var s = (JSON.parse(raw) || {}).state || {};
            if (s.direction === "a" || s.direction === "b" || s.direction === "c" || s.direction === "d") dir = s.direction;
            if (s.direction === "custom") {
              // Custom theme: its base direction + the cached inline overrides (replayed below).
              var cached = JSON.parse(localStorage.getItem("codereview-custom-theme") || "null");
              if (cached && /^[abcd]$/.test(cached.base)) {
                dir = cached.base;
                custom = cached;
              }
            }
            mode = s.mode || s.themeMode || null; // v2 uses `mode`; v1 used `themeMode`
          }
          if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : mode;
          var root = document.documentElement;
          root.className = "cr cr-" + dir + " " + resolved;
          root.style.colorScheme = resolved;
          var vars = custom && custom[resolved];
          if (vars) for (var k in vars) root.style.setProperty(k, vars[k]);
        } catch (e) {
          document.documentElement.className = "cr cr-a dark";
        }
      })();
    </script>
    <style>
      /* Splash theme vars, mirrored from src/styles/tokens.css (not loaded yet). */
      html.cr-a.dark #splash,
      html #splash {
        --s-bg: #0e141b;
        --s-text: #dce4ec;
        --s-muted: #5d6f81;
        --s-accent: #4c9ef8;
        --s-add: #46c26b;
        --s-del: #f2655c;
        --s-track: #243140;
      }
      html.cr-a.light #splash {
        --s-bg: #f4f7fa;
        --s-text: #1a2735;
        --s-muted: #8c9baa;
        --s-accent: #0b6bd9;
        --s-add: #168a3f;
        --s-del: #cb3a30;
        --s-track: #d8e1e9;
      }
      html.cr-b.dark #splash {
        --s-bg: #0b0b0f;
        --s-text: #e8e8ee;
        --s-muted: #62626f;
        --s-accent: #828cf8;
        --s-add: #34d399;
        --s-del: #fb7185;
        --s-track: #232330;
      }
      html.cr-b.light #splash {
        --s-bg: #fafafb;
        --s-text: #1b1b22;
        --s-muted: #94949f;
        --s-accent: #4f46e5;
        --s-add: #0e9f6e;
        --s-del: #e02d3c;
        --s-track: #e6e6ec;
      }
      html.cr-c.dark #splash {
        --s-bg: #15171e;
        --s-text: #d6dae3;
        --s-muted: #5b6275;
        --s-accent: #3fcf8e;
        --s-add: #3fcf8e;
        --s-del: #f7768e;
        --s-track: #2a2f3c;
      }
      html.cr-c.light #splash {
        --s-bg: #f4f2ec;
        --s-text: #2c2e33;
        --s-muted: #9a9c9f;
        --s-accent: #0e9f6e;
        --s-add: #0e9f6e;
        --s-del: #d04a5e;
        --s-track: #dcd8ca;
      }
      html.cr-d.dark #splash {
        --s-bg: #0d1117;
        --s-text: #e6edf3;
        --s-muted: #6e7681;
        --s-accent: #58a6ff;
        --s-add: #3fb950;
        --s-del: #f85149;
        --s-track: #30363d;
      }
      html.cr-d.light #splash {
        --s-bg: #f6f8fa;
        --s-text: #1f2328;
        --s-muted: #656d76;
        --s-accent: #0969da;
        --s-add: #1a7f37;
        --s-del: #cf222e;
        --s-track: #d0d7de;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--s-bg);
        transition: opacity 260ms ease, transform 260ms ease;
      }
      #splash.splash-out {
        opacity: 0;
        transform: scale(0.98);
        pointer-events: none;
      }
      #splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #splash .splash-rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #splash .splash-row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 10px;
      }
      #splash .splash-sign {
        width: 10px;
        font-size: 13px;
        line-height: 1;
        text-align: center;
        opacity: 0;
      }
      #splash .splash-row.del .splash-sign {
        color: var(--s-del);
      }
      #splash .splash-row.add .splash-sign {
        color: var(--s-add);
      }
      #splash .splash-gutter {
        width: 2px;
        height: 14px;
        background: var(--s-muted);
        opacity: 0.5;
      }
      #splash .splash-bar {
        height: 8px;
        border-radius: 2px;
        transform: scaleX(0);
        transform-origin: left;
        animation: splash-draw 420ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      #splash .splash-row.ctx .splash-bar {
        background: var(--s-muted);
        opacity: 0.35;
      }
      #splash .splash-row.del .splash-bar {
        background: var(--s-del);
        width: 70px;
      }
      #splash .splash-row.add .splash-bar {
        background: var(--s-add);
        width: 120px;
        animation: splash-draw 420ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards,
          splash-shimmer 2.2s ease-in-out 1.1s infinite;
      }
      #splash .splash-row:nth-child(1) .splash-bar {
        width: 96px;
      }
      #splash .splash-row:nth-child(4) .splash-bar {
        width: 56px;
      }
      #splash .splash-row:nth-child(1) {
        animation-delay: 0ms;
      }
      #splash .splash-row:nth-child(2) .splash-bar,
      #splash .splash-row:nth-child(2) .splash-sign {
        animation-delay: 110ms;
      }
      #splash .splash-row:nth-child(3) .splash-bar,
      #splash .splash-row:nth-child(3) .splash-sign {
        animation-delay: 220ms;
      }
      #splash .splash-row:nth-child(4) .splash-bar {
        animation-delay: 330ms;
      }
      #splash .splash-row:nth-child(1) .splash-bar {
        animation-delay: 0ms;
      }
      #splash .splash-sign {
        animation: splash-fade-in 200ms ease forwards;
      }
      #splash .splash-wordmark {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--s-text);
      }
      #splash .splash-wordmark span {
        color: var(--s-accent);
      }
      #splash .splash-tagline {
        margin-top: -10px;
        font-size: 11px;
        color: var(--s-muted);
      }
      #splash .splash-progress {
        width: 160px;
        height: 2px;
        border-radius: 1px;
        background: var(--s-track);
        overflow: hidden;
      }
      #splash .splash-progress-fill {
        width: 40%;
        height: 100%;
        background: var(--s-accent);
        border-radius: 1px;
        animation: splash-slide 1.3s ease-in-out infinite;
      }

      @keyframes splash-draw {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes splash-fade-in {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-shimmer {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      @keyframes splash-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash .splash-bar {
          animation: none !important;
          transform: scaleX(1);
        }
        #splash .splash-sign {
          animation: none !important;
          opacity: 1;
        }
        #splash .splash-progress-fill {
          animation: none !important;
          width: 100%;
        }
      }
    </style>
    <script>
      // Safety net: if the app never mounts (e.g. a bundle error), don't leave
      // the splash on screen forever.
      setTimeout(function () {
        var el = document.getElementById("splash");
        if (el) el.remove();
      }, 10000);
    </script>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <div class="splash-rows">
          <div class="splash-row ctx">
            <div class="splash-sign"></div>
            <div class="splash-gutter"></div>
            <div class="splash-bar"></div>
          </div>
          <div class="splash-row del">
            <div class="splash-sign">−</div>
            <div class="splash-gutter"></div>
            <div class="splash-bar"></div>
          </div>
          <div class="splash-row add">
            <div class="splash-sign">+</div>
            <div class="splash-gutter"></div>
            <div class="splash-bar"></div>
          </div>
          <div class="splash-row ctx">
            <div class="splash-sign"></div>
            <div class="splash-gutter"></div>
            <div class="splash-bar"></div>
          </div>
        </div>
        <div class="splash-wordmark">Code<span>Review</span></div>
        <div class="splash-tagline">local PR &amp; branch review</div>
        <div class="splash-progress">
          <div class="splash-progress-fill"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
